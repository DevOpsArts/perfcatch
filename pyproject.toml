[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perfcatch"
version = "0.1.0"
description = "eBPF-based per-request resource measurement for Kubernetes pods"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "kubernetes>=28.0.0",
    "pydantic>=2.0.0",
    "sqlite-utils>=3.35",
]

[project.optional-dependencies]
bpf = ["bcc>=0.28.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
perfcatch = "perfcatch.cli.main:cli"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
